<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f0">
  <title>tudu — make room for today</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f5f0;
      --surface: #fffefa;
      --ink: #20251f;
      --muted: #777d74;
      --line: #e5e8df;
      --green: #426b50;
      --green-dark: #31543d;
      --lime: #d8f08b;
      --coral: #e9785d;
      --shadow: 0 18px 55px rgb(42 52 39 / 8%);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 5%, rgb(216 240 139 / 26%), transparent 27rem),
        radial-gradient(ellipse at 100% 92%, rgb(233 120 93 / 10%), transparent 25rem),
        var(--paper);
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .page {
      width: min(100% - 40px, 900px);
      margin: 0 auto;
      padding: 30px 0 72px;
      animation: arrive 500ms ease-out both;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 46px;
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .brand-mark {
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      border-radius: 9px;
      color: var(--green-dark);
      background: var(--lime);
      font-size: 17px;
      line-height: 1;
    }

    .local-note {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .local-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #78a46c;
      box-shadow: 0 0 0 3px rgb(120 164 108 / 15%);
    }

    .intro { margin-bottom: 29px; }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--green);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(39px, 7vw, 60px);
      font-weight: 400;
      line-height: 1.04;
    }

    h1 span { color: var(--green); font-style: italic; }

    .today-date {
      margin: 13px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .todo-panel {
      overflow: hidden;
      border: 1px solid rgb(225 229 219 / 90%);
      border-radius: 13px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .composer {
      display: flex;
      gap: 10px;
      padding: 18px;
      border-bottom: 1px solid var(--line);
    }

    .task-input {
      min-width: 0;
      flex: 1;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 7px;
      outline: none;
      background: #fff;
      font-size: 14px;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .task-input::placeholder { color: #a0a49c; }

    .task-input:focus {
      border-color: #88a77d;
      box-shadow: 0 0 0 3px rgb(120 164 108 / 14%);
    }

    .add-button {
      min-height: 44px;
      padding: 0 18px;
      border: 0;
      border-radius: 7px;
      color: #fff;
      background: var(--green);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }

    .add-button:hover { background: var(--green-dark); }
    .add-button:active { transform: translateY(1px); }

    .list-header {
      display: flex;
      min-height: 67px;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 22px;
      border-bottom: 1px solid var(--line);
    }

    .filters { display: flex; align-items: center; gap: 5px; }

    .filter-button {
      min-height: 34px;
      padding: 0 12px;
      border: 0;
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      transition: background 150ms ease, color 150ms ease;
    }

    .filter-button:hover { color: var(--ink); background: #f3f5ef; }
    .filter-button[aria-pressed="true"] { color: var(--green-dark); background: #edf3e7; }

    .task-count { color: var(--muted); font-size: 12px; white-space: nowrap; }

    .task-list {
      min-height: 122px;
      margin: 0;
      padding: 0 22px;
      list-style: none;
    }

    .task-row {
      display: flex;
      min-height: 62px;
      align-items: center;
      gap: 13px;
      border-bottom: 1px solid #eff0eb;
      animation: row-in 220ms ease-out both;
    }

    .task-row:last-child { border-bottom: 0; }

    .task-check {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      margin: 0;
      accent-color: var(--green);
      cursor: pointer;
    }

    .task-label {
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.5;
      cursor: pointer;
    }

    .task-row.is-complete .task-label { color: #969b92; text-decoration: line-through; }

    .delete-button {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      place-items: center;
      border: 0;
      border-radius: 6px;
      color: #92978f;
      background: transparent;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      transition: opacity 150ms ease, color 150ms ease, background 150ms ease;
    }

    .task-row:hover .delete-button,
    .delete-button:focus-visible { opacity: 1; }

    .delete-button:hover { color: #a84935; background: #fff0eb; }

    .empty-state {
      display: grid;
      min-height: 156px;
      place-content: center;
      justify-items: center;
      gap: 7px;
      text-align: center;
    }

    .empty-state p { margin: 0; color: var(--muted); font-size: 13px; }

    .empty-spark {
      display: grid;
      width: 31px;
      height: 31px;
      margin-bottom: 4px;
      place-items: center;
      border-radius: 50%;
      color: var(--green-dark);
      background: #edf3e7;
      font-family: Georgia, serif;
      font-size: 18px;
    }

    .panel-footer {
      display: flex;
      min-height: 53px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 22px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    .clear-button {
      padding: 7px 0 7px 8px;
      border: 0;
      color: var(--green);
      background: transparent;
      font-size: 12px;
      cursor: pointer;
    }

    .clear-button:hover { color: var(--green-dark); text-decoration: underline; }
    .clear-button:disabled { visibility: hidden; }

    .storage-warning {
      display: none;
      margin: 14px 0 0;
      color: #a84935;
      font-size: 12px;
    }

    :focus-visible { outline: 2px solid #658a5c; outline-offset: 3px; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes row-in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    @media (max-width: 520px) {
      .page { width: min(100% - 28px, 900px); padding-top: 20px; }
      .topbar { padding-bottom: 38px; }
      .local-note { font-size: 11px; }
      .composer { padding: 13px; }
      .add-button { padding: 0 13px; }
      .list-header { align-items: flex-start; flex-direction: column; gap: 4px; padding: 12px 13px; }
      .filters { width: 100%; justify-content: space-between; }
      .filter-button { padding: 0 10px; }
      .task-count { padding: 0 10px 3px; }
      .task-list { padding: 0 14px; }
      .panel-footer { padding: 10px 14px; }
      .delete-button { opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="wordmark"><span class="brand-mark" aria-hidden="true">t.</span> tudu</div>
      <div class="local-note"><span class="local-dot" aria-hidden="true"></span> Saved on this device</div>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">A fresh page</p>
      <h1 id="page-title">Make room for <span>today.</span></h1>
      <p class="today-date" id="today-date"></p>
    </section>

    <section class="todo-panel" aria-label="Your to-do list">
      <form class="composer" id="task-form">
        <input class="task-input" id="task-input" type="text" maxlength="240" placeholder="What needs doing?" aria-label="New task" autocomplete="off" required>
        <button class="add-button" type="submit">Add task</button>
      </form>

      <div class="list-header">
        <nav class="filters" aria-label="Filter tasks">
          <button class="filter-button" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter-button" type="button" data-filter="active" aria-pressed="false">To do</button>
          <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Done</button>
        </nav>
        <span class="task-count" id="task-count" aria-live="polite"></span>
      </div>

      <ul class="task-list" id="task-list" aria-label="Tasks"></ul>

      <footer class="panel-footer">
        <span id="progress-text"></span>
        <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
      </footer>
    </section>
    <p class="storage-warning" id="storage-warning" role="status">Your browser could not save this change. Check your storage settings.</p>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "tudu.tasks.v1";
      const form = document.querySelector("#task-form");
      const input = document.querySelector("#task-input");
      const list = document.querySelector("#task-list");
      const count = document.querySelector("#task-count");
      const progress = document.querySelector("#progress-text");
      const clearButton = document.querySelector("#clear-completed");
      const warning = document.querySelector("#storage-warning");
      const filterButtons = [...document.querySelectorAll("[data-filter]")];
      let filter = "all";
      let tasks = loadTasks();

      function loadTasks() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          return Array.isArray(saved)
            ? saved.filter((task) => task && typeof task.id === "string" && typeof task.text === "string" && typeof task.completed === "boolean")
            : [];
        } catch {
          warning.style.display = "block";
          return [];
        }
      }

      function saveTasks() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
          warning.style.display = "none";
        } catch {
          warning.style.display = "block";
        }
      }

      function render() {
        const visibleTasks = tasks.filter((task) => {
          if (filter === "active") return !task.completed;
          if (filter === "completed") return task.completed;
          return true;
        });
        const remaining = tasks.filter((task) => !task.completed).length;
        const completed = tasks.length - remaining;

        list.replaceChildren();
        if (visibleTasks.length === 0) {
          const empty = document.createElement("li");
          empty.className = "empty-state";
          const spark = document.createElement("span");
          spark.className = "empty-spark";
          spark.setAttribute("aria-hidden", "true");
          spark.textContent = filter === "completed" ? "✓" : "✳";
          const message = document.createElement("p");
          message.textContent = filter === "completed"
            ? "Nothing checked off just yet."
            : filter === "active" && tasks.length > 0
              ? "All done. Take a breath."
              : "A little space for your first task.";
          empty.append(spark, message);
          list.append(empty);
        } else {
          for (const task of visibleTasks) {
            const row = document.createElement("li");
            row.className = `task-row${task.completed ? " is-complete" : ""}`;
            row.dataset.id = task.id;

            const checkbox = document.createElement("input");
            checkbox.className = "task-check";
            checkbox.type = "checkbox";
            checkbox.checked = task.completed;
            checkbox.setAttribute("aria-label", `${task.completed ? "Mark incomplete" : "Complete"}: ${task.text}`);

            const label = document.createElement("label");
            label.className = "task-label";
            label.textContent = task.text;

            const remove = document.createElement("button");
            remove.className = "delete-button";
            remove.type = "button";
            remove.setAttribute("aria-label", `Delete: ${task.text}`);
            remove.title = "Delete task";
            remove.textContent = "×";

            label.htmlFor = `task-${task.id}`;
            checkbox.id = `task-${task.id}`;
            row.append(checkbox, label, remove);
            list.append(row);
          }
        }

        count.textContent = `${remaining} ${remaining === 1 ? "task" : "tasks"} left`;
        progress.textContent = tasks.length === 0
          ? "Start wherever you are."
          : `${completed} of ${tasks.length} done`;
        clearButton.disabled = completed === 0;
        filterButtons.forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.filter === filter));
        });
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        tasks.unshift({ id: crypto.randomUUID(), text, completed: false });
        saveTasks();
        filter = "all";
        input.value = "";
        render();
        input.focus();
      });

      list.addEventListener("change", (event) => {
        if (!event.target.matches(".task-check")) return;
        const row = event.target.closest(".task-row");
        const task = tasks.find((item) => item.id === row.dataset.id);
        if (task) task.completed = event.target.checked;
        saveTasks();
        render();
      });

      list.addEventListener("click", (event) => {
        const button = event.target.closest(".delete-button");
        if (!button) return;
        const row = button.closest(".task-row");
        tasks = tasks.filter((task) => task.id !== row.dataset.id);
        saveTasks();
        render();
      });

      filterButtons.forEach((button) => {
        button.addEventListener("click", () => {
          filter = button.dataset.filter;
          render();
        });
      });

      clearButton.addEventListener("click", () => {
        tasks = tasks.filter((task) => !task.completed);
        saveTasks();
        render();
      });

      document.querySelector("#today-date").textContent = new Intl.DateTimeFormat(undefined, {
        weekday: "long", month: "long", day: "numeric"
      }).format(new Date());

      render();
    })();
  </script>
</body>
</html>
